<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1170" width="100%" height="100%" style="font-family: Arial, Helvetica, sans-serif; background-color: #ffffff;">
  <defs>
    <marker id="arrow-miss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f4e79" />
    </marker>
    <marker id="arrow-reuse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d35400" />
    </marker>
    <marker id="arrow-hit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e8449" />
    </marker>
    <marker id="arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b" />
    </marker>
    <marker id="arrow-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7f8c8d" />
    </marker>
  </defs>

  <!-- ===================== Swimlanes ===================== -->
  <rect x="20" y="20" width="300" height="1040" rx="8" fill="#eef6fc" stroke="#5b9bd5" stroke-width="2.5" />
  <rect x="20" y="20" width="300" height="56" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="2.5" />
  <text x="170" y="57" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f4e79">Browser</text>

  <rect x="335" y="20" width="600" height="1040" rx="8" fill="#eef9f1" stroke="#54a868" stroke-width="2.5" />
  <rect x="335" y="20" width="600" height="56" rx="8" fill="#d4efdf" stroke="#54a868" stroke-width="2.5" />
  <text x="635" y="57" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e5631">FastAPI Backend</text>

  <rect x="950" y="20" width="230" height="1040" rx="8" fill="#f5eef8" stroke="#8e44ad" stroke-width="2.5" />
  <rect x="950" y="20" width="230" height="56" rx="8" fill="#ebdef0" stroke="#8e44ad" stroke-width="2.5" />
  <text x="1065" y="57" font-size="26" font-weight="bold" text-anchor="middle" fill="#512e5f">PostgreSQL</text>

  <!-- ===================== [1] -> [2] ===================== -->
  <rect x="35" y="100" width="270" height="80" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="2" />
  <text x="170" y="148" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[1] Submit Variant</text>
  <line x1="305" y1="140" x2="552" y2="140" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-miss)" />

  <polygon points="620,110 770,180 620,250 470,180" fill="#fff9e6" stroke="#d68910" stroke-width="2.5" />
  <text x="620" y="188" font-size="23" font-weight="bold" text-anchor="middle" fill="#7e5109">[2] Cache Lookup</text>

  <line x1="770" y1="180" x2="960" y2="180" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="12,4,2,4" marker-start="url(#arrow-db)" marker-end="url(#arrow-db)" />
  <rect x="960" y="145" width="210" height="70" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="2" />
  <text x="1065" y="188" font-size="23" text-anchor="middle" fill="#512e5f">Query cache</text>

  <!-- Hit -->
  <polyline points="470,180 400,180 400,280 305,280" fill="none" stroke="#1e8449" stroke-width="3.5" stroke-dasharray="3,4" marker-end="url(#arrow-hit)" />
  <rect x="365" y="212" width="70" height="34" rx="4" fill="#ffffff" stroke="#1e8449" stroke-width="1.5" />
  <text x="400" y="237" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e8449">Hit</text>
  <rect x="35" y="240" width="270" height="80" rx="18" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.5" />
  <text x="170" y="288" font-size="23" font-weight="bold" text-anchor="middle" fill="#145a32">Cached Result</text>

  <!-- Miss -> [3] VEP -> [4] Gatekeeper (gatekeeper trước khi trích xuất đặc trưng) -->
  <line x1="620" y1="250" x2="620" y2="341" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-miss)" />
  <rect x="587" y="270" width="66" height="34" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5" />
  <text x="620" y="295" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f4e79">Miss</text>

  <rect x="410" y="345" width="420" height="80" rx="8" fill="#fef5e7" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,4" />
  <text x="620" y="379" font-size="23" font-weight="bold" text-anchor="middle" fill="#7e5109">[3] VEP Annotation</text>
  <text x="620" y="409" font-size="21" text-anchor="middle" fill="#5d6d7e">consequence, transcript, bio features</text>
  <line x1="620" y1="425" x2="620" y2="486" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-miss)" />

  <!-- [4] Gatekeeper -->
  <polygon points="620,490 760,550 620,610 480,550" fill="#fff9e6" stroke="#d68910" stroke-width="2.5" />
  <text x="620" y="545" font-size="23" font-weight="bold" text-anchor="middle" fill="#7e5109">[4] Missense</text>
  <text x="620" y="573" font-size="23" font-weight="bold" text-anchor="middle" fill="#7e5109">Gatekeeper</text>

  <line x1="480" y1="550" x2="305" y2="550" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow-reject)" />
  <rect x="350" y="508" width="90" height="34" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" />
  <text x="395" y="533" font-size="22" font-weight="bold" text-anchor="middle" fill="#c0392b">Reject</text>
  <rect x="35" y="510" width="270" height="80" rx="18" fill="#fadbd8" stroke="#c0392b" stroke-width="2.5" />
  <text x="170" y="558" font-size="23" font-weight="bold" text-anchor="middle" fill="#922b21">Error (422 / 400)</text>

  <line x1="620" y1="610" x2="620" y2="646" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-miss)" />

  <!-- [5] -> [8] -->
  <rect x="410" y="650" width="420" height="80" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="620" y="684" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[5] NT-v1 + ESM-1b + SpliceAI</text>
  <text x="620" y="714" font-size="21" text-anchor="middle" fill="#5d6d7e">1,001 bp / 501 aa windows</text>
  <line x1="620" y1="730" x2="620" y2="766" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-miss)" />

  <rect x="410" y="770" width="420" height="60" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="620" y="808" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[6] Geometry &amp; Save Features</text>
  <line x1="830" y1="800" x2="960" y2="800" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="12,4,2,4" marker-end="url(#arrow-db)" />
  <rect x="960" y="765" width="210" height="70" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="2" />
  <text x="1065" y="808" font-size="23" text-anchor="middle" fill="#512e5f">Save features</text>
  <line x1="620" y1="830" x2="620" y2="866" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-miss)" />

  <rect x="410" y="870" width="420" height="60" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="620" y="908" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[7] Classify</text>
  <line x1="620" y1="930" x2="620" y2="966" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-miss)" />

  <rect x="410" y="970" width="420" height="60" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="620" y="1008" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[8] Save &amp; Respond</text>
  <line x1="830" y1="1000" x2="960" y2="1000" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="12,4,2,4" marker-end="url(#arrow-db)" />
  <rect x="960" y="965" width="210" height="70" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="2" />
  <text x="1065" y="1008" font-size="23" text-anchor="middle" fill="#512e5f">Save prediction</text>

  <line x1="410" y1="1000" x2="305" y2="1000" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-miss)" />
  <rect x="35" y="960" width="270" height="80" rx="18" fill="#d9eaf7" stroke="#1f4e79" stroke-width="2.5" />
  <text x="170" y="1008" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">Show Result</text>

  <!-- Feature reuse (drawn last) -->
  <polyline points="695,215 880,215 880,900 834,900" fill="none" stroke="#d35400" stroke-width="3.5" stroke-dasharray="10,6" marker-end="url(#arrow-reuse)" />
  <rect x="842" y="533" width="76" height="34" rx="4" fill="#ffffff" stroke="#d35400" stroke-width="1.5" />
  <text x="880" y="558" font-size="22" font-weight="bold" text-anchor="middle" fill="#d35400">Reuse</text>

  <!-- ===================== Legend ===================== -->
  <rect x="20" y="1080" width="1160" height="70" rx="8" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="2" />
  <line x1="45" y1="1115" x2="105" y2="1115" stroke="#1e8449" stroke-width="4" stroke-dasharray="3,4" marker-end="url(#arrow-hit)" />
  <text x="117" y="1123" font-size="22" fill="#1e8449">Cache hit</text>
  <line x1="265" y1="1115" x2="325" y2="1115" stroke="#d35400" stroke-width="4" stroke-dasharray="10,6" marker-end="url(#arrow-reuse)" />
  <text x="337" y="1123" font-size="22" fill="#d35400">Feature reuse</text>
  <line x1="525" y1="1115" x2="585" y2="1115" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow-miss)" />
  <text x="597" y="1123" font-size="22" fill="#1f4e79">Cache miss</text>
  <line x1="770" y1="1115" x2="830" y2="1115" stroke="#7f8c8d" stroke-width="2.5" stroke-dasharray="12,4,2,4" marker-end="url(#arrow-db)" />
  <text x="842" y="1123" font-size="22" fill="#5d6d7e">Database</text>
  <line x1="985" y1="1115" x2="1045" y2="1115" stroke="#c0392b" stroke-width="4" marker-end="url(#arrow-reject)" />
  <text x="1057" y="1123" font-size="22" fill="#c0392b">Reject</text>
</svg>
