<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1140" width="100%" height="100%" style="font-family: Arial, Helvetica, sans-serif; background-color: #ffffff;">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f4e79" />
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d35400" />
    </marker>
    <marker id="arrow-sse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d35400" />
    </marker>
    <marker id="arrow-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e8449" />
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b" />
    </marker>
  </defs>

  <!-- ===================== Swimlanes ===================== -->
  <rect x="20" y="20" width="300" height="1010" rx="8" fill="#eef6fc" stroke="#5b9bd5" stroke-width="2.5" />
  <rect x="20" y="20" width="300" height="56" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="2.5" />
  <text x="170" y="57" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f4e79">Browser</text>

  <rect x="335" y="20" width="845" height="1010" rx="8" fill="#eef9f1" stroke="#54a868" stroke-width="2.5" />
  <rect x="335" y="20" width="845" height="56" rx="8" fill="#d4efdf" stroke="#54a868" stroke-width="2.5" />
  <text x="757" y="57" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e5631">FastAPI Backend</text>

  <!-- ===================== [1] -> [3] ===================== -->
  <rect x="35" y="100" width="270" height="80" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="2" />
  <text x="170" y="148" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[1] Upload Variants</text>
  <line x1="305" y1="135" x2="666" y2="135" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-solid)" />

  <rect x="670" y="100" width="380" height="70" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="860" y="143" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[2] Parse &amp; Deduplicate</text>
  <line x1="860" y1="170" x2="860" y2="206" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-solid)" />

  <rect x="670" y="210" width="380" height="85" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="860" y="245" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[3] Cohort Annotation</text>
  <text x="860" y="277" font-size="21" text-anchor="middle" fill="#5d6d7e">VEP · Gatekeeper · SpliceAI</text>

  <!-- ===================== Outer loop ===================== -->
  <rect x="620" y="330" width="540" height="530" rx="10" fill="#f4f9fd" stroke="#2874a6" stroke-width="3" stroke-dasharray="12,6" />

  <rect x="670" y="380" width="380" height="70" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="860" y="423" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[4] Batched NT-v1 + ESM-1b</text>

  <rect x="670" y="490" width="380" height="70" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="860" y="533" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[5] Geometry &amp; Save</text>

  <!-- ===================== Inner loop ===================== -->
  <rect x="645" y="590" width="455" height="245" rx="8" fill="#fef9e7" stroke="#d35400" stroke-width="2.5" stroke-dasharray="8,5" />

  <rect x="670" y="630" width="380" height="70" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
  <text x="860" y="673" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[6] Classify + IG</text>

  <rect x="670" y="740" width="380" height="70" rx="8" fill="#ffffff" stroke="#d35400" stroke-width="2.5" />
  <text x="860" y="783" font-size="23" font-weight="bold" text-anchor="middle" fill="#7e5109">[7] Emit SSE Event</text>

  <!-- Loop-back arrows -->
  <polyline points="1050,775 1075,775 1075,665 1056,665" fill="none" stroke="#d35400" stroke-width="2.5" marker-end="url(#arrow-loop)" />
  <polyline points="1100,815 1135,815 1135,415 1056,415" fill="none" stroke="#2874a6" stroke-width="2.5" marker-end="url(#arrow-solid)" />

  <!-- Loop labels -->
  <rect x="632" y="312" width="210" height="36" rx="4" fill="#2874a6" />
  <text x="737" y="337" font-size="21" font-weight="bold" text-anchor="middle" fill="#ffffff">Micro-batch ≤ 8</text>
  <rect x="657" y="572" width="160" height="36" rx="4" fill="#d35400" />
  <text x="737" y="597" font-size="21" font-weight="bold" text-anchor="middle" fill="#ffffff">Per variant</text>

  <!-- ===================== Browser events ===================== -->
  <line x1="620" y1="525" x2="305" y2="525" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-err)" />
  <rect x="380" y="475" width="170" height="34" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" />
  <text x="465" y="500" font-size="21" font-weight="bold" text-anchor="middle" fill="#c0392b">stream_error</text>
  <rect x="35" y="485" width="270" height="80" rx="14" fill="#fadbd8" stroke="#c0392b" stroke-width="2" />
  <text x="170" y="533" font-size="23" font-weight="bold" text-anchor="middle" fill="#922b21">Abort Stream</text>

  <line x1="670" y1="775" x2="305" y2="775" stroke="#d35400" stroke-width="3.5" stroke-dasharray="8,5" marker-end="url(#arrow-sse)" />
  <rect x="360" y="700" width="230" height="62" rx="5" fill="#ffffff" stroke="#d35400" stroke-width="1.5" />
  <text x="475" y="726" font-size="21" font-weight="bold" text-anchor="middle" fill="#d35400">variant_stream /</text>
  <text x="475" y="751" font-size="21" font-weight="bold" text-anchor="middle" fill="#d35400">variant_skipped</text>
  <rect x="35" y="735" width="270" height="80" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="2.5" />
  <text x="170" y="783" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">[8] Update Table</text>

  <!-- ===================== [9] ===================== -->
  <rect x="670" y="920" width="380" height="70" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.5" />
  <text x="860" y="963" font-size="23" font-weight="bold" text-anchor="middle" fill="#145a32">[9] Close Stream</text>
  <line x1="670" y1="955" x2="305" y2="955" stroke="#1e8449" stroke-width="3.5" stroke-dasharray="3,4" marker-end="url(#arrow-done)" />
  <rect x="375" y="905" width="210" height="34" rx="4" fill="#ffffff" stroke="#1e8449" stroke-width="1.5" />
  <text x="480" y="930" font-size="21" font-weight="bold" text-anchor="middle" fill="#1e8449">stream_completed</text>
  <rect x="35" y="915" width="270" height="80" rx="18" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.5" />
  <text x="170" y="963" font-size="23" font-weight="bold" text-anchor="middle" fill="#145a32">Show Summary</text>

  <!-- ===================== Main control arrows (drawn after loop backgrounds) ===================== -->
  <line x1="860" y1="295" x2="860" y2="376" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-solid)" />
  <line x1="860" y1="450" x2="860" y2="486" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-solid)" />
  <line x1="860" y1="560" x2="860" y2="626" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-solid)" />
  <line x1="860" y1="700" x2="860" y2="736" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-solid)" />
  <line x1="860" y1="860" x2="860" y2="916" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow-solid)" />

  <!-- ===================== Legend ===================== -->
  <rect x="20" y="1050" width="1160" height="70" rx="8" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="2" />
  <line x1="45" y1="1085" x2="105" y2="1085" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow-solid)" />
  <text x="117" y="1093" font-size="22" fill="#1f4e79">Control flow</text>
  <line x1="330" y1="1085" x2="390" y2="1085" stroke="#d35400" stroke-width="4" stroke-dasharray="8,5" marker-end="url(#arrow-sse)" />
  <text x="402" y="1093" font-size="22" fill="#d35400">SSE event</text>
  <line x1="590" y1="1085" x2="650" y2="1085" stroke="#1e8449" stroke-width="4" stroke-dasharray="3,4" marker-end="url(#arrow-done)" />
  <text x="662" y="1093" font-size="22" fill="#1e8449">Stream completed</text>
  <line x1="900" y1="1085" x2="960" y2="1085" stroke="#c0392b" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrow-err)" />
  <text x="972" y="1093" font-size="22" fill="#c0392b">Stream error</text>
</svg>
