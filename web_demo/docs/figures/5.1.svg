<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="font-family: Arial, Helvetica, sans-serif; background-color: #ffffff;">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d35400" />
    </marker>
    <marker id="arrow-dotted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2980b9" />
    </marker>
  </defs>

  <!-- ===================== Presentation tier ===================== -->
  <rect x="30" y="20" width="1140" height="150" rx="10" fill="#eef6fc" stroke="#5b9bd5" stroke-width="2.5" />
  <text x="55" y="58" font-size="26" font-weight="bold" fill="#1f4e79">PRESENTATION TIER · React</text>
  <rect x="60" y="80" width="250" height="60" rx="6" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.5" />
  <text x="185" y="118" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">Overview</text>
  <rect x="330" y="80" width="250" height="60" rx="6" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.5" />
  <text x="455" y="118" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">Single Variant</text>
  <rect x="600" y="80" width="250" height="60" rx="6" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.5" />
  <text x="725" y="118" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">Batch Screening</text>
  <rect x="870" y="80" width="270" height="60" rx="6" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.5" />
  <text x="1005" y="118" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">XAI Attribution</text>

  <!-- REST / SSE -->
  <line x1="360" y1="174" x2="360" y2="266" stroke="#2c3e50" stroke-width="3" marker-start="url(#arrow-solid)" marker-end="url(#arrow-solid)" />
  <rect x="380" y="203" width="90" height="34" rx="4" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5" />
  <text x="425" y="228" font-size="23" font-weight="bold" text-anchor="middle" fill="#2c3e50">REST</text>
  <line x1="840" y1="266" x2="840" y2="174" stroke="#d35400" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-dashed)" />
  <rect x="860" y="203" width="80" height="34" rx="4" fill="#ffffff" stroke="#e67e22" stroke-width="1.5" />
  <text x="900" y="228" font-size="23" font-weight="bold" text-anchor="middle" fill="#d35400">SSE</text>

  <!-- ===================== Application tier ===================== -->
  <rect x="30" y="270" width="1140" height="290" rx="10" fill="#eef9f1" stroke="#54a868" stroke-width="2.5" />
  <text x="55" y="308" font-size="26" font-weight="bold" fill="#1e5631">APPLICATION TIER · FastAPI</text>
  <rect x="55" y="325" width="1090" height="50" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="2" />
  <text x="600" y="358" font-size="23" font-weight="bold" text-anchor="middle" fill="#1e5631">Inference Manager + Hybrid Cache</text>

  <rect x="55" y="395" width="665" height="148" rx="8" fill="#ffffff" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="8,5" />
  <text x="75" y="424" font-size="21" font-weight="bold" fill="#d35400">Background threads</text>
  <rect x="75" y="440" width="270" height="88" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="2" />
  <text x="210" y="476" font-size="23" font-weight="bold" text-anchor="middle" fill="#7e5109">VEP Annotation</text>
  <text x="210" y="508" font-size="21" text-anchor="middle" fill="#5d6d7e">Missense Gatekeeper</text>
  <rect x="365" y="440" width="335" height="88" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="2" />
  <text x="532" y="476" font-size="23" font-weight="bold" text-anchor="middle" fill="#7e5109">Feature Extraction</text>
  <text x="532" y="508" font-size="21" text-anchor="middle" fill="#5d6d7e">NT-v1 · ESM-1b · FAISS</text>

  <rect x="740" y="395" width="280" height="66" rx="6" fill="#ffffff" stroke="#54a868" stroke-width="2" />
  <text x="880" y="436" font-size="23" font-weight="bold" text-anchor="middle" fill="#1e5631">Checkpoint Registry</text>
  <rect x="740" y="477" width="280" height="66" rx="6" fill="#ffffff" stroke="#54a868" stroke-width="2" />
  <text x="880" y="518" font-size="23" font-weight="bold" text-anchor="middle" fill="#1e5631">IG + Attention</text>

  <!-- ===================== Data tier ===================== -->
  <rect x="30" y="640" width="1140" height="240" rx="10" fill="#f5eef8" stroke="#8e44ad" stroke-width="2.5" />
  <text x="55" y="678" font-size="26" font-weight="bold" fill="#512e5f">DATA TIER</text>

  <rect x="70" y="700" width="270" height="140" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="2" />
  <text x="205" y="764" font-size="23" font-weight="bold" text-anchor="middle" fill="#7e5109">VEP Container</text>
  <text x="205" y="796" font-size="21" text-anchor="middle" fill="#5d6d7e">+ dbNSFP</text>
  <rect x="370" y="700" width="230" height="140" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" />
  <text x="485" y="764" font-size="23" font-weight="bold" text-anchor="middle" fill="#1b4f72">Reference Files</text>
  <text x="485" y="796" font-size="21" text-anchor="middle" fill="#5d6d7e">FASTA · SpliceAI</text>
  <rect x="630" y="700" width="200" height="140" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" />
  <text x="730" y="764" font-size="23" font-weight="bold" text-anchor="middle" fill="#1b4f72">FAISS Indexes</text>
  <text x="730" y="796" font-size="21" text-anchor="middle" fill="#5d6d7e">DNA · Protein</text>
  <rect x="880" y="700" width="260" height="140" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2" />
  <text x="1010" y="764" font-size="23" font-weight="bold" text-anchor="middle" fill="#4a235a">PostgreSQL</text>
  <text x="1010" y="796" font-size="21" text-anchor="middle" fill="#5d6d7e">+ pgvector</text>

  <!-- ===================== Connectors (drawn last) ===================== -->
  <line x1="230" y1="528" x2="230" y2="696" stroke="#d35400" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-dashed)" />
  <rect x="160" y="585" width="140" height="34" rx="4" fill="#ffffff" stroke="#e67e22" stroke-width="1.5" />
  <text x="230" y="610" font-size="21" font-weight="bold" text-anchor="middle" fill="#d35400">docker exec</text>

  <line x1="532" y1="528" x2="532" y2="615" stroke="#2980b9" stroke-width="3" stroke-dasharray="3,4" />
  <line x1="485" y1="615" x2="730" y2="615" stroke="#2980b9" stroke-width="3" stroke-dasharray="3,4" />
  <line x1="485" y1="615" x2="485" y2="696" stroke="#2980b9" stroke-width="3" stroke-dasharray="3,4" marker-end="url(#arrow-dotted)" />
  <line x1="730" y1="615" x2="730" y2="696" stroke="#2980b9" stroke-width="3" stroke-dasharray="3,4" marker-end="url(#arrow-dotted)" />
  <rect x="472" y="560" width="120" height="34" rx="4" fill="#ffffff" stroke="#2980b9" stroke-width="1.5" />
  <text x="532" y="585" font-size="21" font-weight="bold" text-anchor="middle" fill="#2980b9">file read</text>

  <line x1="1080" y1="379" x2="1080" y2="696" stroke="#2c3e50" stroke-width="3" marker-start="url(#arrow-solid)" marker-end="url(#arrow-solid)" />
  <rect x="1045" y="585" width="70" height="34" rx="4" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5" />
  <text x="1080" y="610" font-size="21" font-weight="bold" text-anchor="middle" fill="#2c3e50">SQL</text>
</svg>
